name: tests

on:
  push:
    paths:
      - 'examples/e2e-client-server-demo/**'
  pull_request:
    paths:
      - 'examples/e2e-client-server-demo/**'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/e2e-client-server-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run API tests
        run: pytest -m api --html=report-api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: examples/e2e-client-server-demo/report-api.html

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/e2e-client-server-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r requirements.txt
      - name: Run UI tests (headless)
        env:
          HEADLESS: 'true'
        run: pytest -m ui --html=report-ui.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-artifacts
          path: |
            examples/e2e-client-server-demo/report-ui.html
            examples/e2e-client-server-demo/screenshots/
